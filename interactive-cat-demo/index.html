<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ef">
<title>Fluffy • Layered Puppet Cat</title>
<style>
:root{--ink:#3f2b27;--muted:#866b63;--glass:rgba(255,255,255,.76);--line:rgba(94,61,49,.13);--mx:0;--my:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}body{overflow:hidden;touch-action:none;user-select:none;color:var(--ink);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;background:radial-gradient(circle at 18% 18%,#ffd9bd 0,transparent 30%),radial-gradient(circle at 82% 18%,#ffd7e2 0,transparent 28%),linear-gradient(145deg,#fffaf6,#fff0e6 56%,#fff8f2)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#76503f14 .75px,transparent .75px);background-size:18px 18px;mask-image:linear-gradient(#0009,transparent 84%)}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.top{display:flex;align-items:center;justify-content:space-between;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo,.btn,.smallbtn,.card{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 12px 30px #70452e12}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.09em;text-transform:uppercase}.smallbtn{border-radius:14px;padding:9px 12px;color:inherit;font-weight:850;cursor:pointer}.stage{position:relative;display:grid;place-items:center;min-height:0}.scene{position:relative;width:min(88vw,650px);aspect-ratio:1}.halo{position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffffff9c 44%,transparent 73%);filter:blur(5px)}.shadow{position:absolute;left:23%;right:23%;bottom:7.5%;height:7%;border-radius:50%;background:#6741281e;filter:blur(15px);transform:rotateX(65deg)}
.puppet{position:absolute;inset:0;filter:drop-shadow(0 24px 24px #6b46221a)}.layer{position:absolute;inset:0;background-image:url('./cat-clean.webp');background-size:100% 100%;background-repeat:no-repeat;transform-origin:center;will-change:transform}.body{clip-path:polygon(6% 40%,18% 33%,34% 34%,51% 35%,66% 43%,73% 57%,77% 76%,72% 92%,57% 98%,36% 99%,17% 95%,7% 82%);animation:breathe 3.4s ease-in-out infinite}.head{clip-path:ellipse(34% 31% at 43% 36%);transform-origin:44% 58%;animation:headIdle 5.2s ease-in-out infinite}.earL{clip-path:polygon(27% 0,49% 0,47% 25%,29% 24%);transform-origin:42% 23%;animation:earL 5.8s ease-in-out infinite}.earR{clip-path:polygon(53% 10%,81% 13%,73% 35%,55% 31%);transform-origin:61% 31%;animation:earR 6.7s ease-in-out infinite}.tail{clip-path:polygon(62% 37%,100% 37%,100% 96%,69% 96%,61% 77%);transform-origin:72% 78%;animation:tail 2.9s ease-in-out infinite}.pawL{clip-path:polygon(18% 67%,43% 66%,44% 98%,18% 98%);transform-origin:34% 70%;animation:pawL 4.5s ease-in-out infinite}.pawR{clip-path:polygon(40% 66%,66% 66%,66% 98%,40% 98%);transform-origin:50% 70%;animation:pawR 4.9s ease-in-out infinite}.faceFx{position:absolute;inset:0;pointer-events:none}.blink{position:absolute;top:25.6%;height:7.3%;width:11.5%;border-radius:55%;background:#fff4e8;opacity:0;transform:scaleY(.1);transform-origin:center}.blink.l{left:33.3%}.blink.r{left:51%}.pupil{position:absolute;width:2.7%;aspect-ratio:1;border-radius:50%;background:#1d1715;box-shadow:0 0 0 2px #ffffff33;transition:transform .08s linear}.pupil.l{left:39.1%;top:26.8%}.pupil.r{left:56.8%;top:31.9%}.whisk{position:absolute;height:2px;width:20%;background:linear-gradient(90deg,#fff0,#fff 22%,#fff);border-radius:99px;transform-origin:100% 50%;opacity:.95}.whisk.w1{left:17%;top:36.4%;transform:rotate(4deg)}.whisk.w2{left:16%;top:39.2%;transform:rotate(-2deg)}.whisk.w3{right:18%;top:40%;transform:scaleX(-1) rotate(3deg)}.whisk.w4{right:16%;top:43%;transform:scaleX(-1) rotate(-3deg)}
@keyframes breathe{50%{transform:scale(1.012,.994) translateY(1px)}}@keyframes headIdle{0%,100%{transform:translate(0,0) rotate(-1deg)}50%{transform:translate(2px,1px) rotate(1.4deg)}}@keyframes earL{0%,76%,100%{transform:rotate(0)}80%{transform:rotate(-10deg)}84%{transform:rotate(5deg)}88%{transform:rotate(-2deg)}}@keyframes earR{0%,69%,100%{transform:rotate(0)}73%{transform:rotate(9deg)}77%{transform:rotate(-4deg)}81%{transform:rotate(2deg)}}@keyframes tail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}@keyframes pawL{0%,82%,100%{transform:translateY(0) rotate(0)}87%{transform:translate(-3px,-7px) rotate(-2deg)}92%{transform:translateY(0)}}@keyframes pawR{0%,80%,100%{transform:translateY(0) rotate(0)}85%{transform:translate(3px,-8px) rotate(2deg)}90%{transform:translateY(0)}}
.puppet.pet .head{animation:nuzzle .52s ease-in-out infinite alternate}.puppet.pet .earL{transform:rotate(-12deg)}.puppet.pet .earR{transform:rotate(12deg)}.puppet.pet .pawL{animation:pawPress .48s ease-in-out infinite alternate}.puppet.pet .pawR{animation:pawPress .48s ease-in-out infinite alternate-reverse}.puppet.sleep .head{animation:sleepHead 5s ease-in-out infinite}.puppet.sleep .tail{animation:tailSleep 6.5s ease-in-out infinite}.puppet.sleep .pawL,.puppet.sleep .pawR{animation:none}.puppet.play .tail{animation:tailFast .55s ease-in-out infinite}.puppet.play .pawL{animation:swat .46s ease-in-out infinite}.puppet.play .pawR{animation:swat .46s ease-in-out infinite reverse}@keyframes nuzzle{to{transform:translate(3px,-5px) rotate(2deg) scale(1.012)}}@keyframes pawPress{to{transform:translateY(-6px) rotate(-3deg)}}@keyframes sleepHead{0%,100%{transform:translateY(7px) rotate(-4deg)}50%{transform:translateY(10px) rotate(-3deg)}}@keyframes tailSleep{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(1deg)}}@keyframes tailFast{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(12deg)}}@keyframes swat{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(8px,-16px) rotate(8deg)}}
.blink.on{opacity:1;animation:blink .18s ease 2 alternate}@keyframes blink{to{transform:scaleY(1)}}.speech{position:absolute;top:13%;left:66%;max-width:185px;padding:10px 14px;border-radius:18px 18px 18px 5px;background:#fffffff0;border:1px solid var(--line);box-shadow:0 12px 28px #60402d18;font-size:13px;font-weight:850;opacity:0;transform:translateY(8px) scale(.96);transition:.18s;pointer-events:none}.speech.on{opacity:1;transform:none}.card{position:absolute;border-radius:19px;padding:12px 14px}.status{left:0;top:50%;transform:translateY(-50%);width:165px}.status b{display:block;font-size:12px}.status p{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.4}.parts{right:0;top:50%;transform:translateY(-50%);width:180px}.parts b{font-size:12px;display:block;margin-bottom:6px}.parts span{display:inline-block;padding:4px 7px;margin:2px;border-radius:999px;background:#fff8;font-size:9px;font-weight:800;color:var(--muted)}.hint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);font-size:11px;color:var(--muted);font-weight:750;white-space:nowrap}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;z-index:20}.btn{border-radius:17px;padding:11px 15px;color:inherit;font-size:13px;font-weight:900;cursor:pointer;transition:.15s}.btn:hover,.smallbtn:hover{transform:translateY(-2px)}.btn:active,.smallbtn:active{transform:scale(.98)}.laser{position:fixed;width:14px;height:14px;border-radius:50%;background:#ff4d75;box-shadow:0 0 0 5px #ff4d7522,0 0 22px #ff4d75aa;translate:-50% -50%;opacity:0;pointer-events:none;z-index:90}.laser.on{opacity:1}.heart{position:fixed;z-index:100;pointer-events:none;font-size:18px;animation:heart 1s ease-out forwards}@keyframes heart{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-100px) scale(1.2)}}
@media(max-width:900px){.status,.parts{top:auto;bottom:0;transform:none}.scene{width:min(98vw,600px)}}@media(max-width:650px){.scene{width:110vw;transform:translateX(-5vw)}.parts{display:none}.status{left:50%;transform:translateX(-50%);width:220px;bottom:-2px;text-align:center}.hint{bottom:13%;font-size:9px}.speech{left:60%;font-size:11px}.btn{padding:10px 12px;font-size:12px}.smallbtn{padding:8px 10px;font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">🐾</div><div>Fluffy<small>layered 2D puppet</small></div></div><button id="sound" class="smallbtn">🔊 Sound</button></header>
<main class="stage">
<div class="card status"><b id="mood">🥰 Cozy</b><p id="desc">The cute artwork stays intact. The head, ears, tail and paws move separately.</p></div>
<div class="scene">
<div class="halo"></div><div class="shadow"></div>
<div id="puppet" class="puppet">
  <div class="layer tail" data-part="tail"></div>
  <div class="layer body" data-part="body"></div>
  <div class="layer pawL" data-part="left paw"></div>
  <div class="layer pawR" data-part="right paw"></div>
  <div class="layer head" data-part="head"></div>
  <div class="layer earL" data-part="left ear"></div>
  <div class="layer earR" data-part="right ear"></div>
  <div class="faceFx">
    <div class="blink l"></div><div class="blink r"></div>
    <div class="pupil l"></div><div class="pupil r"></div>
    <div class="whisk w1"></div><div class="whisk w2"></div><div class="whisk w3"></div><div class="whisk w4"></div>
  </div>
</div>
<div id="speech" class="speech">mrrp?</div>
</div>
<div class="card parts"><b>Independent layers</b><span>head</span><span>left ear</span><span>right ear</span><span>left paw</span><span>right paw</span><span>tail</span><span>pupils</span><span>whiskers</span><span>blink</span></div>
<div class="hint">Move cursor • pet cat • laser makes paws and tail react</div>
</main>
<footer class="controls"><button class="btn" data-a="pet">🫳 Pet</button><button class="btn" data-a="play">🔴 Laser</button><button class="btn" data-a="blink">👀 Blink</button><button class="btn" data-a="nap">🌙 Nap</button></footer>
</div>
<div id="laser" class="laser"></div>
<script>
(()=>{const p=document.getElementById('puppet'),speech=document.getElementById('speech'),laser=document.getElementById('laser'),mood=document.getElementById('mood'),desc=document.getElementById('desc'),bl=[...document.querySelectorAll('.blink')],pl=document.querySelector('.pupil.l'),pr=document.querySelector('.pupil.r'),soundBtn=document.getElementById('sound');let pet=false,play=false,sleep=false,sound=true,timer,ctx,po,pg,lo;const say=(t,m=1400)=>{clearTimeout(timer);speech.textContent=t;speech.classList.add('on');timer=setTimeout(()=>speech.classList.remove('on'),m)};const burst=(x,y)=>{for(let i=0;i<3;i++){const h=document.createElement('div');h.className='heart';h.textContent=i%2?'✨':'💗';h.style.left=x+(Math.random()*32-16)+'px';h.style.top=y+(Math.random()*12-6)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),1050)}};function blink(){bl.forEach(x=>{x.classList.remove('on');void x.offsetWidth;x.classList.add('on')})}function audio(){if(!sound)return null;ctx||=new(AudioContext||webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function chirp(){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(430,a.currentTime);o.frequency.exponentialRampToValueAtTime(680,a.currentTime+.08);o.frequency.exponentialRampToValueAtTime(520,a.currentTime+.2);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.04,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.22);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.24)}function purr(){const a=audio();if(!a||po)return;po=a.createOscillator();pg=a.createGain();lo=a.createOscillator();const q=a.createGain();po.type='triangle';po.frequency.value=48;lo.frequency.value=22;q.gain.value=.014;pg.gain.value=.018;lo.connect(q).connect(pg.gain);po.connect(pg).connect(a.destination);po.start();lo.start()}function stop(){if(po){try{po.stop();lo.stop()}catch{}po=pg=lo=null}}addEventListener('pointermove',e=>{const nx=(e.clientX/innerWidth-.5)*2,ny=(e.clientY/innerHeight-.5)*2;pl.style.transform=`translate(${nx*5}px,${ny*3}px)`;pr.style.transform=`translate(${nx*5}px,${ny*3}px)`;if(play){laser.style.left=e.clientX+'px';laser.style.top=e.clientY+'px';document.querySelector('.head').style.transform=`translate(${nx*4}px,${ny*2}px) rotate(${nx*1.4}deg)`}if(pet&&Math.random()>.74)burst(e.clientX,e.clientY)});p.addEventListener('pointerdown',e=>{pet=true;p.classList.add('pet');purr();say('prrrrr…');burst(e.clientX,e.clientY)});addEventListener('pointerup',()=>{if(pet){pet=false;p.classList.remove('pet');stop();chirp();say('tiny headbutt 💗')}});document.querySelectorAll('.layer').forEach(el=>el.addEventListener('pointerdown',()=>{const part=el.dataset.part;if(part&&part!=='body')say(part+' moved on its own ✨',900)}));document.querySelectorAll('.btn').forEach(btn=>btn.onclick=()=>{const a=btn.dataset.a;if(a==='pet'){p.classList.add('pet');setTimeout(()=>p.classList.remove('pet'),850);say('chin scratches!');mood.textContent='🥰 Melted';desc.textContent='Head nuzzles while the paws press and the ears fold separately.';chirp()}if(a==='play'){play=!play;p.classList.toggle('play',play);laser.classList.toggle('on',play);btn.textContent=play?'⏹ Stop':'🔴 Laser';say(play?'hunter mode 👀':'good hunt!');mood.textContent=play?'🤩 Hunter':'🥰 Cozy';desc.textContent=play?'The pupils track your pointer while both paws swat and the tail speeds up.':'Back to loafing.';if(!play)document.querySelector('.head').style.transform=''}if(a==='blink'){blink();say('slow blink 🐾');chirp()}if(a==='nap'){sleep=!sleep;p.classList.toggle('sleep',sleep);if(sleep){play=false;p.classList.remove('play');laser.classList.remove('on');document.querySelector('[data-a=play]').textContent='🔴 Laser';blink();mood.textContent='😴 Sleepy';desc.textContent='Head droops, tail slows, paws stop kneading.';say('tiny nap… 🌙')}else{mood.textContent='😺 Awake';desc.textContent='Stretching every little part again.';say('mrrrow… stretch!');chirp()}}});soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'🔊 Sound':'🔇 Muted';if(!sound)stop();else chirp()};setInterval(()=>{if(!sleep&&!pet&&!play&&Math.random()<.5)blink()},2600);setInterval(()=>{if(!sleep&&!pet&&!play&&Math.random()<.28)say(['mrrp?','🐾','prrr…','watching you 👀'][Math.floor(Math.random()*4)],1000)},4600)})();
</script>
</body></html>
