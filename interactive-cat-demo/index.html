<style>
:root{--ink:#402d29;--muted:#896d65;--glass:rgba(255,255,255,.76);--line:rgba(86,55,44,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}body{overflow:hidden;user-select:none;touch-action:none;color:var(--ink);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;background:radial-gradient(circle at 18% 18%,#ffd7bb 0,transparent 31%),radial-gradient(circle at 82% 19%,#ffd9e4 0,transparent 28%),linear-gradient(145deg,#fffaf6,#fff0e7 57%,#fff8f2)}

.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(15px,env(safe-area-inset-top)) max(15px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(15px,env(safe-area-inset-left))}.top{display:flex;justify-content:space-between;align-items:center;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo,.sound,.btn,.card{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 12px 32px #6a402a13}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.09em;text-transform:uppercase;margin-top:2px}.name{border:0;background:none;color:inherit;font:inherit;font-weight:900;width:120px;outline:none}.sound{border-radius:16px;padding:10px 13px;color:inherit;font-weight:850;cursor:pointer}.stage{position:relative;display:grid;place-items:center;min-height:0}.scene{position:relative;width:min(82vw,620px);aspect-ratio:1}.halo{position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffffffa0 42%,transparent 72%);filter:blur(5px);animation:halo 5s ease-in-out infinite}.shadow{position:absolute;left:24%;right:24%;bottom:8%;height:9%;border-radius:50%;background:#5f3f2d20;filter:blur(15px);transform:rotateX(65deg);animation:shadow 3.6s ease-in-out infinite}.cat-svg{position:absolute;inset:1%;width:98%;height:98%;overflow:visible;filter:drop-shadow(0 22px 24px #6d462319);cursor:pointer}.part{transform-box:fill-box;transform-origin:center;will-change:transform}.tail{transform-origin:26% 82%;animation:tailSway 3.2s ease-in-out infinite}.body{animation:breathe 3.5s ease-in-out infinite}.chest{animation:chest 3.5s ease-in-out infinite}.head{transform-origin:50% 72%;animation:headIdle 5.6s ease-in-out infinite}.ear-l{transform-origin:72% 88%;animation:earL 7.1s ease-in-out infinite}.ear-r{transform-origin:28% 88%;animation:earR 6.3s ease-in-out infinite}.eye-l{animation:blinkL 6.4s infinite}.eye-r{animation:blinkR 6.4s infinite}.pupil{transform-box:fill-box;transform-origin:center;transition:transform .08s linear}.whisker-l{transform-origin:100% 50%;animation:whiskL 4.6s ease-in-out infinite}.whisker-r{transform-origin:0 50%;animation:whiskR 4.9s ease-in-out infinite}.paw-l{transform-origin:55% 15%;animation:kneadL 4.8s ease-in-out infinite}.paw-r{transform-origin:45% 15%;animation:kneadR 4.8s ease-in-out infinite 1.1s}.hind-l{animation:hindL 5.7s ease-in-out infinite}.hind-r{animation:hindR 5.9s ease-in-out infinite}.nose{animation:sniff 3.9s ease-in-out infinite}.mouth{transform-origin:50% 0}.brow-l,.brow-r{transition:transform .18s ease}.cheek-l,.cheek-r{animation:cheek 3.3s ease-in-out infinite}.fur-tip{animation:fur 2.8s ease-in-out infinite alternate}.cat-svg.petting .head{animation:nuzzle .55s ease-in-out infinite alternate}.cat-svg.petting .ear-l{transform:rotate(-12deg)}.cat-svg.petting .ear-r{transform:rotate(12deg)}.cat-svg.petting .eye-l,.cat-svg.petting .eye-r{transform:scaleY(.22)}.cat-svg.petting .whisker-l{transform:rotate(-3deg)}.cat-svg.petting .whisker-r{transform:rotate(3deg)}.cat-svg.sleeping .eye-l,.cat-svg.sleeping .eye-r{transform:scaleY(.08)!important}.cat-svg.sleeping .head{animation:sleepHead 5s ease-in-out infinite}.cat-svg.sleeping .tail{animation:tailSleep 7s ease-in-out infinite}.cat-svg.sleeping .ear-l,.cat-svg.sleeping .ear-r{animation:none;transform:rotate(0)}.cat-svg.sleeping .body,.cat-svg.sleeping .chest{animation-duration:5.2s}.paw-r.wave{animation:pawWave .75s ease-in-out 2}.paw-l.swipe{animation:pawSwipe .42s cubic-bezier(.2,.8,.2,1)}.tail.startled{animation:tailPop .62s cubic-bezier(.2,.8,.2,1) 2}.mouth.meow{animation:meowMouth .4s ease 2}.brow-l.annoy{transform:rotate(10deg) translateY(2px)}.brow-r.annoy{transform:rotate(-10deg) translateY(2px)}
@keyframes halo{50%{transform:scale(1.045);opacity:.82}}@keyframes shadow{50%{transform:rotateX(65deg) scaleX(1.03);opacity:.72}}@keyframes breathe{50%{transform:scale(1.018,.992) translateY(1px)}}@keyframes chest{50%{transform:translateY(2px) scaleX(1.012)}}@keyframes headIdle{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(1.2deg) translateY(1px)}}@keyframes earL{0%,76%,100%{transform:rotate(0)}80%{transform:rotate(-9deg)}83%{transform:rotate(4deg)}86%{transform:rotate(-2deg)}}@keyframes earR{0%,69%,100%{transform:rotate(0)}73%{transform:rotate(8deg)}76%{transform:rotate(-4deg)}79%{transform:rotate(2deg)}}@keyframes tailSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}@keyframes tailSleep{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(1deg)}}@keyframes whiskL{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.5deg)}}@keyframes whiskR{0%,100%{transform:rotate(0)}50%{transform:rotate(1.5deg)}}@keyframes kneadL{0%,82%,100%{transform:translateY(0)}87%{transform:translateY(-5px) rotate(-2deg)}92%{transform:translateY(0)}}@keyframes kneadR{0%,83%,100%{transform:translateY(0)}88%{transform:translateY(-4px) rotate(2deg)}93%{transform:translateY(0)}}@keyframes hindL{50%{transform:translateX(-1.5px)}}@keyframes hindR{50%{transform:translateX(1.5px)}}@keyframes sniff{0%,91%,100%{transform:scale(1)}94%{transform:scale(1.08,.94)}97%{transform:scale(.96,1.04)}}@keyframes cheek{50%{transform:scale(1.015)}}@keyframes fur{to{transform:translateY(1.5px) rotate(.5deg)}}@keyframes nuzzle{to{transform:translateY(-5px) rotate(1.8deg) scale(1.015)}}@keyframes sleepHead{0%,100%{transform:rotate(-4deg) translateY(4px)}50%{transform:rotate(-3deg) translateY(7px)}}@keyframes pawWave{0%,100%{transform:rotate(0) translateY(0)}35%{transform:rotate(-23deg) translate(-9px,-34px)}65%{transform:rotate(13deg) translate(5px,-29px)}}@keyframes pawSwipe{0%{transform:rotate(0)}45%{transform:translate(18px,-24px) rotate(18deg)}100%{transform:rotate(0)}}@keyframes tailPop{0%,100%{transform:rotate(0)}25%{transform:rotate(18deg) scaleX(1.05)}60%{transform:rotate(-12deg)}}@keyframes meowMouth{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.65)}}
.card{position:absolute;border-radius:20px;padding:13px 15px}.status{left:0;top:50%;transform:translateY(-50%);width:170px}.status b{display:block;font-size:12px}.status p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.4}.parts{right:0;top:50%;transform:translateY(-50%);width:178px}.parts b{display:block;font-size:12px;margin-bottom:6px}.parts span{display:inline-block;padding:4px 7px;margin:2px;border-radius:999px;background:#fff8;font-size:9px;font-weight:800;color:var(--muted)}.bubble{position:absolute;top:13%;left:67%;padding:10px 14px;max-width:180px;border-radius:18px 18px 18px 5px;background:#fffffff4;border:1px solid var(--line);box-shadow:0 12px 30px #5c3c2b1c;font-size:13px;font-weight:850;opacity:0;transform:translateY(7px) scale(.96);transition:.2s;pointer-events:none;z-index:8}.bubble.on{opacity:1;transform:none}.hint{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);color:var(--muted);font-size:11px;font-weight:750;white-space:nowrap}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;z-index:20}.btn{border-radius:18px;padding:12px 15px;color:inherit;font-size:13px;font-weight:900;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.98)}.laser{position:fixed;width:14px;height:14px;border-radius:50%;background:#ff4e75;box-shadow:0 0 0 6px #ff4e7520,0 0 25px #ff4e75cc;translate:-50% -50%;opacity:0;pointer-events:none;z-index:60}.laser.on{opacity:1}.particle{position:fixed;pointer-events:none;z-index:80;font-size:18px;animation:particle .9s ease-out forwards}@keyframes particle{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-95px) scale(1.2)}}
@media(max-width:900px){.status,.parts{top:auto;bottom:0;transform:none}.scene{width:min(95vw,590px)}.parts{right:0}.status{left:0}}@media(max-width:650px){.scene{width:108vw;max-width:none;transform:translateX(-4vw);margin-top:1vh}.parts{display:none}.status{left:50%;transform:translateX(-50%);width:230px;bottom:-2px;text-align:center}.hint{bottom:15%;font-size:9px}.bubble{left:61%;font-size:11px}.sound{font-size:11px;padding:9px 10px}.btn{padding:11px 12px}.brand small{font-size:8px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>

<body>

<script>
(()=>{
const $=s=>document.querySelector(s),cat=$('#cat'),headMotion=$('#headMotion'),bodyMotion=$('#bodyMotion'),pl=$('#pupilLeft'),pr=$('#pupilRight'),pawL=$('#pawLeft'),pawR=$('#pawRight'),tail=$('#tail'),mouth=$('#mouth'),earL=$('#earLeft'),earR=$('#earRight'),browL=$('#browLeft'),browR=$('#browRight'),bubble=$('#bubble'),laser=$('#laser'),status=$('#status'),mood=$('#mood'),soundBtn=$('#sound');
let petting=false,laserMode=false,sleeping=false,sound=true,audioCtx,purrOsc,purrGain,purrLfo,swipeTimer,sayTimer,lastParticle=0;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function say(t,ms=1250){clearTimeout(sayTimer);bubble.textContent=t;bubble.classList.add('on');sayTimer=setTimeout(()=>bubble.classList.remove('on'),ms)}
function setMood(e,t,p){mood.textContent=e+' '+t;status.textContent=p}
function particle(x,y,ch='💗'){const n=document.createElement('div');n.className='particle';n.textContent=ch;n.style.left=x+'px';n.style.top=y+'px';document.body.appendChild(n);setTimeout(()=>n.remove(),950)}
function ctx(){if(!sound)return null;audioCtx||=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function meow(freq=430){const a=ctx();if(!a)return;mouth.classList.remove('meow');void mouth.getBBox();mouth.classList.add('meow');setTimeout(()=>mouth.classList.remove('meow'),850);const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,a.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.35,a.currentTime+.09);o.frequency.exponentialRampToValueAtTime(freq*.92,a.currentTime+.29);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.045,a.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.31);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.33)}
function startPurr(){const a=ctx();if(!a||purrOsc)return;purrOsc=a.createOscillator();purrGain=a.createGain();purrLfo=a.createOscillator();const l=a.createGain();purrOsc.type='triangle';purrOsc.frequency.value=47;purrLfo.frequency.value=22;l.gain.value=.013;purrGain.gain.value=.017;purrLfo.connect(l).connect(purrGain.gain);purrOsc.connect(purrGain).connect(a.destination);purrOsc.start();purrLfo.start()}
function stopPurr(){if(!purrOsc)return;try{purrOsc.stop();purrLfo.stop()}catch{}purrOsc=purrGain=purrLfo=null}
function blink(){if(sleeping||petting)return;const eye=Math.random()<.22?(Math.random()<.5?$('#eyeLeft'):$('#eyeRight')):null;if(eye){eye.style.transform='scaleY(.08)';setTimeout(()=>eye.style.transform='',105)}else{const l=$('#eyeLeft'),r=$('#eyeRight');l.style.transform=r.style.transform='scaleY(.07)';setTimeout(()=>l.style.transform=r.style.transform='',110);if(Math.random()<.35)setTimeout(()=>{l.style.transform=r.style.transform='scaleY(.08)';setTimeout(()=>l.style.transform=r.style.transform='',95)},190)}}
function reactPaw(paw,right=false){paw.classList.remove(right?'wave':'swipe');void paw.getBBox();paw.classList.add(right?'wave':'swipe');setTimeout(()=>paw.classList.remove(right?'wave':'swipe'),1600);say(right?'high paw! 🐾':'gotcha!');meow(right?510:560)}
function tailReact(){tail.classList.remove('startled');void tail.getBBox();tail.classList.add('startled');browL.classList.add('annoy');browR.classList.add('annoy');say('hey, my tail! 😾');setMood('😼','Sassy','Tail privileges are under review.');meow(330);setTimeout(()=>{tail.classList.remove('startled');browL.classList.remove('annoy');browR.classList.remove('annoy');setMood('🥰','Cozy','Every body part has its own little life.')},1500)}
function petStart(e){if(sleeping){wake();return}petting=true;cat.classList.add('petting');startPurr();say('prrrrr…');setMood('🥹','Melted','Head, ears, eyes and whiskers react separately.');particle(e.clientX,e.clientY)}
function petMove(e){if(!petting)return;if(performance.now()-lastParticle>110){lastParticle=performance.now();particle(e.clientX,e.clientY,Math.random()>.45?'💗':'✨')}}
function petEnd(){if(!petting)return;petting=false;cat.classList.remove('petting');stopPurr();meow(500);say('more? 🐾');setMood('🥰','Cozy','Every body part has its own little life.')}
function sleep(){laserMode=false;laser.classList.remove('on');clearInterval(swipeTimer);sleeping=true;cat.classList.add('sleeping');setMood('😴','Napping','Breathing continues while the head and tail settle down.');say('mrr… zzz');pr.style.transform=pl.style.transform=''}
function wake(){sleeping=false;cat.classList.remove('sleeping');setMood('😺','Awake','Tiny stretch. Maximum curiosity restored.');say('mrrrow… stretch!');meow(470);pawR.classList.add('wave');setTimeout(()=>pawR.classList.remove('wave'),1500)}
function look(e){const rect=cat.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height*.43,nx=clamp((e.clientX-cx)/(rect.width*.5),-1,1),ny=clamp((e.clientY-cy)/(rect.height*.5),-1,1),strength=laserMode?1.6:1;headMotion.style.transform=`translate(${nx*6*strength}px,${ny*3*strength}px) rotate(${nx*2.8*strength}deg)`;bodyMotion.style.transform=`translateX(${nx*1.7}px) rotate(${nx*.45}deg)`;pl.style.transform=`translate(${nx*6*strength}px,${ny*5*strength}px)`;pr.style.transform=`translate(${nx*6*strength}px,${ny*5*strength}px)`;if(nx<-.65){earL.style.transform='rotate(-5deg)'}else if(nx>.65){earR.style.transform='rotate(5deg)'}else{if(!petting){earL.style.transform='';earR.style.transform=''}}if(laserMode){laser.style.left=e.clientX+'px';laser.style.top=e.clientY+'px'}}
addEventListener('pointermove',e=>{look(e);petMove(e)});addEventListener('pointerup',petEnd);addEventListener('pointercancel',petEnd);addEventListener('blur',()=>{petting=false;stopPurr()});
$('#headMotion').addEventListener('pointerdown',petStart);$('#chest').addEventListener('pointerdown',petStart);pawL.addEventListener('pointerdown',e=>{e.stopPropagation();reactPaw(pawL,false)});pawR.addEventListener('pointerdown',e=>{e.stopPropagation();reactPaw(pawR,true)});tail.addEventListener('pointerdown',e=>{e.stopPropagation();tailReact()});
$('#body').addEventListener('pointerdown',e=>{e.stopPropagation();blink();say('slow blink = trust 💗');particle(e.clientX,e.clientY,'✨')});
document.querySelectorAll('.btn').forEach(btn=>btn.onclick=()=>{const a=btn.dataset.a;if(a==='pet'){const r=cat.getBoundingClientRect();petStart({clientX:r.left+r.width*.5,clientY:r.top+r.height*.28});setTimeout(petEnd,900)}if(a==='treat'){if(sleeping)wake();say('nom nom nom! 🍗');setMood('😸','Snack mode','Nose sniffs, eyes focus, mouth chomps.');const r=cat.getBoundingClientRect();for(let i=0;i<5;i++)setTimeout(()=>particle(r.left+r.width*(.43+Math.random()*.15),r.top+r.height*(.45+Math.random()*.12),'✨'),i*90);mouth.classList.add('meow');setTimeout(()=>mouth.classList.remove('meow'),750);meow(560)}if(a==='laser'){if(sleeping)wake();laserMode=!laserMode;laser.classList.toggle('on',laserMode);btn.textContent=laserMode?'⏹ Stop laser':'🔴 Laser';setMood(laserMode?'🤩':'🥰',laserMode?'Hunter mode':'Cozy',laserMode?'Eyes, head, ears and paws now track the target.':'Every body part has its own little life.');say(laserMode?'TARGET! 👀':'good hunt!');clearInterval(swipeTimer);if(laserMode){meow(590);swipeTimer=setInterval(()=>reactPaw(Math.random()>.5?pawL:pawR,Math.random()>.5),2200)}}if(a==='nap'){sleeping?wake():sleep()}});
soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'🔊 Sound on':'🔇 Sound off';if(!sound)stopPurr();else meow(490)};$('#name').oninput=e=>e.target.value=e.target.value.slice(0,14);
setInterval(blink,3200+Math.random()*1900);setInterval(()=>{if(!sleeping&&!petting&&Math.random()<.5){Math.random()<.5?(earL.style.transform='rotate(-9deg)',setTimeout(()=>earL.style.transform='',190)):(earR.style.transform='rotate(9deg)',setTimeout(()=>earR.style.transform='',190))}},3600);setInterval(()=>{if(!sleeping&&!laserMode&&!petting&&Math.random()<.4){say(['mrrp?','tiny chirp ✨','*sniff sniff*','🐾'][Math.floor(Math.random()*4)],900);if(Math.random()<.45)meow(470+Math.random()*90)}},5600)
})();
</script>
</body>
</html>
