<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7ef"><title>Fluffy • True Puppet Rig</title>
<style>
:root{--ink:#3d2c29;--muted:#8b6f68;--glass:rgba(255,255,255,.78);--line:rgba(95,63,50,.14);--orange:#ef9c63;--orange2:#f7b27f;--cream:#fff6ea;--pink:#ef9aa7;--eye:#7e4d24}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}body{overflow:hidden;user-select:none;touch-action:none;color:var(--ink);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;background:radial-gradient(circle at 18% 18%,#ffd8bc 0,transparent 30%),radial-gradient(circle at 82% 18%,#ffd9e3 0,transparent 28%),linear-gradient(145deg,#fffaf6,#fff0e7 56%,#fff8f2)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#76503f15 .75px,transparent .75px);background-size:18px 18px;mask-image:linear-gradient(#0009,transparent 84%)}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.top{display:flex;align-items:center;justify-content:space-between;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo,.btn,.smallbtn,.card{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 12px 30px #70452e12}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase}.topBtns{display:flex;gap:8px}.smallbtn{border-radius:14px;padding:9px 12px;font-weight:850;color:inherit;cursor:pointer}.stage{position:relative;display:grid;place-items:center;min-height:0}.scene{position:relative;width:min(92vw,690px);aspect-ratio:1}.halo{position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffffff9a 43%,transparent 72%);filter:blur(5px)}.shadow{position:absolute;left:25%;right:25%;bottom:8%;height:8%;background:#6a43281d;border-radius:50%;filter:blur(15px);transform:rotateX(67deg)}svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 24px 24px #6c45231a)}.part{transform-box:fill-box;transform-origin:center;will-change:transform}.clickable{cursor:pointer}.speech{position:absolute;left:66%;top:13%;max-width:190px;padding:10px 14px;border-radius:18px 18px 18px 6px;background:#fffffff0;border:1px solid var(--line);box-shadow:0 12px 28px #60402d18;font-weight:850;font-size:13px;opacity:0;transform:translateY(8px) scale(.96);transition:.18s;pointer-events:none}.speech.on{opacity:1;transform:none}.hint{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);font-size:11px;color:var(--muted);font-weight:750;white-space:nowrap}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;z-index:20}.btn{border-radius:17px;padding:11px 15px;color:inherit;font-weight:900;cursor:pointer;transition:.15s}.btn:hover,.smallbtn:hover{transform:translateY(-2px)}.btn:active,.smallbtn:active{transform:scale(.98)}.joint{opacity:0;pointer-events:none}.rig .joint{opacity:1}.rig .part{filter:drop-shadow(0 0 1px #fff)}.label{font:700 12px system-ui;fill:#785d8f;opacity:0;pointer-events:none}.rig .label{opacity:1}.laser{position:fixed;width:14px;height:14px;border-radius:50%;background:#ff4d75;box-shadow:0 0 0 5px #ff4d7522,0 0 22px #ff4d75aa;translate:-50% -50%;opacity:0;pointer-events:none;z-index:90}.laser.on{opacity:1}.heart{position:fixed;z-index:100;pointer-events:none;font-size:18px;animation:heart 1s ease-out forwards}@keyframes heart{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-100px) scale(1.2)}}@media(max-width:620px){.scene{width:112vw;transform:translateX(-6vw)}.speech{left:60%;top:10%;font-size:12px}.hint{bottom:7%;font-size:10px}.btn{padding:10px 12px;font-size:12px}.smallbtn{padding:8px 10px;font-size:11px}}
</style></head>
<body><div class="app"><div class="top"><div class="brand"><div class="logo">🐾</div><div>Fluffy<small>true articulated vector rig</small></div></div><div class="topBtns"><button id="rigBtn" class="smallbtn">🦴 Show rig</button><button id="soundBtn" class="smallbtn">🔊 Sound</button></div></div><main class="stage"><div class="scene"><div class="halo"></div><div class="shadow"></div>
<svg id="cat" viewBox="0 0 600 600" role="img" aria-label="Interactive articulated fluffy cat">
<defs>
<linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc391"/><stop offset="1" stop-color="#e98c55"/></linearGradient>
<linearGradient id="fur2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd2a9"/><stop offset="1" stop-color="#f0a069"/></linearGradient>
<radialGradient id="cream" cx="45%" cy="35%"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f6e8d8"/></radialGradient>
<radialGradient id="iris"><stop stop-color="#c9853b"/><stop offset=".72" stop-color="#7a451e"/><stop offset="1" stop-color="#3a251b"/></radialGradient>
</defs>
<!-- tail: genuinely chained joints -->
<g id="tailRoot" class="part clickable" data-part="tail" transform="translate(454 399)">
  <g id="tail1" class="part"><ellipse cx="28" cy="28" rx="68" ry="40" fill="url(#fur)" transform="rotate(-34)"/>
    <g transform="translate(62 -18)"><circle class="joint" r="7" fill="#9a77c4"/><text class="label" x="10" y="-10">tail 1</text>
    <g id="tail2" class="part"><ellipse cx="45" cy="0" rx="65" ry="35" fill="url(#fur2)" transform="rotate(-10)"/>
      <g transform="translate(90 -9)"><circle class="joint" r="7" fill="#9a77c4"/><text class="label" x="9" y="-10">tail 2</text>
      <g id="tail3" class="part"><ellipse cx="35" cy="0" rx="54" ry="30" fill="url(#fur)" transform="rotate(8)"/><ellipse cx="70" cy="4" rx="28" ry="24" fill="url(#cream)"/>
      <circle class="joint" cx="0" cy="0" r="7" fill="#9a77c4"/><text class="label" x="8" y="-10">tail 3</text></g></g>
    </g></g>
  </g><circle class="joint" r="8" fill="#8c64bb"/><text class="label" x="12" y="-12">tail root</text>
</g>
<!-- hind legs behind body -->
<g id="hindL" class="part clickable" data-part="hind-left" transform="translate(222 430)"><ellipse cx="0" cy="10" rx="65" ry="84" fill="url(#fur2)"/><ellipse id="hindPawL" class="part" cx="-8" cy="74" rx="57" ry="28" fill="url(#cream)"/><circle class="joint" r="7" fill="#6b9ac4"/><text class="label" x="9" y="-10">left hip</text></g>
<g id="hindR" class="part clickable" data-part="hind-right" transform="translate(378 430)"><ellipse cx="0" cy="10" rx="65" ry="84" fill="url(#fur2)"/><ellipse id="hindPawR" class="part" cx="8" cy="74" rx="57" ry="28" fill="url(#cream)"/><circle class="joint" r="7" fill="#6b9ac4"/><text class="label" x="9" y="-10">right hip</text></g>
<!-- torso -->
<g id="body" class="part clickable" data-part="belly"><ellipse cx="300" cy="359" rx="130" ry="157" fill="url(#fur)"/><path d="M210 310 C245 280 354 278 391 311 C386 374 360 434 302 472 C244 438 216 380 210 310Z" fill="url(#cream)" opacity=".98"/><circle class="joint" cx="300" cy="355" r="8" fill="#df7f95"/><text class="label" x="310" y="343">body</text></g>
<!-- chest fluff separate -->
<g id="chest" class="part clickable" data-part="chest"><path d="M226 295 C241 259 274 244 301 250 C334 242 369 262 378 296 C390 326 371 355 347 365 C349 395 326 410 302 414 C278 411 253 397 254 368 C224 356 209 326 226 295Z" fill="url(#cream)"/><path d="M263 355 l20 42 18-28 18 29 22-43" fill="none" stroke="#eadaca" stroke-width="9" stroke-linecap="round"/><circle class="joint" cx="302" cy="335" r="7" fill="#df7f95"/><text class="label" x="312" y="326">chest</text></g>
<!-- front left arm, nested elbow and paw -->
<g id="armL" class="part clickable" data-part="left-arm" transform="translate(246 340)"><ellipse cx="-18" cy="59" rx="31" ry="73" fill="url(#fur2)"/><circle class="joint" r="7" fill="#55a487"/><text class="label" x="-63" y="-9">L shoulder</text><g id="foreL" class="part" transform="translate(-18 55)"><ellipse cx="0" cy="47" rx="28" ry="58" fill="url(#cream)"/><circle class="joint" r="6" fill="#55a487"/><text class="label" x="-54" y="-8">L elbow</text><g id="pawL" class="part clickable" data-part="left-paw" transform="translate(0 91)"><ellipse cx="0" cy="0" rx="40" ry="25" fill="url(#cream)"/><path d="M-16 -2v11M0 -5v14M16 -2v11" stroke="#dfcfc1" stroke-width="3" stroke-linecap="round"/><circle class="joint" r="6" fill="#55a487"/><text class="label" x="-27" y="38">L paw</text></g></g></g>
<!-- front right arm -->
<g id="armR" class="part clickable" data-part="right-arm" transform="translate(354 340)"><ellipse cx="18" cy="59" rx="31" ry="73" fill="url(#fur2)"/><circle class="joint" r="7" fill="#55a487"/><text class="label" x="10" y="-9">R shoulder</text><g id="foreR" class="part" transform="translate(18 55)"><ellipse cx="0" cy="47" rx="28" ry="58" fill="url(#cream)"/><circle class="joint" r="6" fill="#55a487"/><text class="label" x="10" y="-8">R elbow</text><g id="pawR" class="part clickable" data-part="right-paw" transform="translate(0 91)"><ellipse cx="0" cy="0" rx="40" ry="25" fill="url(#cream)"/><path d="M-16 -2v11M0 -5v14M16 -2v11" stroke="#dfcfc1" stroke-width="3" stroke-linecap="round"/><circle class="joint" r="6" fill="#55a487"/><text class="label" x="10" y="38">R paw</text></g></g></g>
<!-- neck joint + head -->
<g transform="translate(300 240)"><circle class="joint" r="9" fill="#f08a4d"/><text class="label" x="12" y="-12">neck</text>
<g id="head" class="part clickable" data-part="head">
  <ellipse cx="0" cy="-8" rx="121" ry="103" fill="url(#fur2)"/>
  <!-- ears move separately -->
  <g id="earL" class="part clickable" data-part="left-ear" transform="translate(-73 -75)"><path d="M-33 18 Q-24 -84 20 -22 Q24 7 10 28Z" fill="url(#fur)"/><path d="M-18 8 Q-11 -52 10 -18 Q11 0 4 15Z" fill="#f3a7ad"/><circle class="joint" r="6" fill="#f08a4d"/><text class="label" x="-54" y="35">L ear</text></g>
  <g id="earR" class="part clickable" data-part="right-ear" transform="translate(73 -75)"><path d="M33 18 Q24 -84 -20 -22 Q-24 7 -10 28Z" fill="url(#fur)"/><path d="M18 8 Q11 -52 -10 -18 Q-11 0 -4 15Z" fill="#f3a7ad"/><circle class="joint" r="6" fill="#f08a4d"/><text class="label" x="12" y="35">R ear</text></g>
  <!-- forehead tuft --> <path d="M-24 -92 l14-26 11 22 14-24 8 31" fill="url(#fur)"/>
  <!-- muzzle/cheeks separate -->
  <g id="cheekL" class="part" transform="translate(-38 29)"><ellipse rx="48" ry="37" fill="url(#cream)"/></g><g id="cheekR" class="part" transform="translate(38 29)"><ellipse rx="48" ry="37" fill="url(#cream)"/></g>
  <!-- eyes separate -->
  <g id="eyeL" class="part clickable" data-part="left-eye" transform="translate(-48 -17)"><ellipse rx="29" ry="34" fill="#fff" stroke="#4c3029" stroke-width="4"/><ellipse rx="21" ry="27" fill="url(#iris)"/><g id="pupilL" class="part"><ellipse rx="10" ry="18" fill="#171414"/><circle cx="-7" cy="-10" r="5" fill="#fff"/><circle cx="7" cy="8" r="2" fill="#fff"/></g><circle class="joint" r="5" fill="#4d86ce"/><text class="label" x="-41" y="-42">L eye</text></g>
  <g id="eyeR" class="part clickable" data-part="right-eye" transform="translate(48 -17)"><ellipse rx="29" ry="34" fill="#fff" stroke="#4c3029" stroke-width="4"/><ellipse rx="21" ry="27" fill="url(#iris)"/><g id="pupilR" class="part"><ellipse rx="10" ry="18" fill="#171414"/><circle cx="-7" cy="-10" r="5" fill="#fff"/><circle cx="7" cy="8" r="2" fill="#fff"/></g><circle class="joint" r="5" fill="#4d86ce"/><text class="label" x="12" y="-42">R eye</text></g>
  <!-- brows --> <path id="browL" class="part" d="M-73 -59 Q-50 -70 -28 -58" fill="none" stroke="#d27b4e" stroke-width="8" stroke-linecap="round"/><path id="browR" class="part" d="M28 -58 Q50 -70 73 -59" fill="none" stroke="#d27b4e" stroke-width="8" stroke-linecap="round"/>
  <!-- nose and mouth separate -->
  <g id="nose" class="part clickable" data-part="nose" transform="translate(0 23)"><path d="M-14 0 Q0 -11 14 0 Q9 14 0 15 Q-9 14 -14 0Z" fill="#ed8f9c"/><circle class="joint" r="5" fill="#e35c70"/></g>
  <g id="mouth" class="part clickable" data-part="mouth" transform="translate(0 43)"><path d="M0 0 Q-14 17 -29 5 M0 0 Q14 17 29 5" fill="none" stroke="#6a4037" stroke-width="4" stroke-linecap="round"/><path id="tongue" d="M-13 12 Q0 36 13 12 Q0 25 -13 12Z" fill="#ef8e98" opacity="0"/></g>
  <!-- whiskers separate left/right -->
  <g id="whiskL" class="part clickable" data-part="left-whiskers" fill="none" stroke="#7f685f" stroke-width="2.5" stroke-linecap="round"><path d="M-57 35 Q-105 28 -135 17"/><path d="M-58 44 Q-108 44 -142 48"/><path d="M-55 52 Q-101 61 -132 76"/></g>
  <g id="whiskR" class="part clickable" data-part="right-whiskers" fill="none" stroke="#7f685f" stroke-width="2.5" stroke-linecap="round"><path d="M57 35 Q105 28 135 17"/><path d="M58 44 Q108 44 142 48"/><path d="M55 52 Q101 61 132 76"/></g>
  <circle class="joint" cx="0" cy="0" r="7" fill="#f08a4d"/><text class="label" x="10" y="-110">head</text>
</g></g>
</svg><div id="speech" class="speech">mrrp?</div><div class="hint">Touch individual parts • eyes follow you • turn on Rig view to see the joints</div></div></main><div class="controls"><button class="btn" data-a="pet">🫳 Pet head</button><button class="btn" data-a="wave">🐾 Wave</button><button class="btn" data-a="laser">🔴 Laser</button><button class="btn" data-a="nap">🌙 Nap</button></div></div><div id="laser" class="laser"></div>
<script>
(()=>{const $=id=>document.getElementById(id),cat=$('cat'),speech=$('speech'),laser=$('laser');const P={head:$('head'),earL:$('earL'),earR:$('earR'),eyeL:$('eyeL'),eyeR:$('eyeR'),pupilL:$('pupilL'),pupilR:$('pupilR'),cheekL:$('cheekL'),cheekR:$('cheekR'),nose:$('nose'),mouth:$('mouth'),tongue:$('tongue'),whiskL:$('whiskL'),whiskR:$('whiskR'),body:$('body'),chest:$('chest'),armL:$('armL'),armR:$('armR'),foreL:$('foreL'),foreR:$('foreR'),pawL:$('pawL'),pawR:$('pawR'),hindL:$('hindL'),hindR:$('hindR'),hindPawL:$('hindPawL'),hindPawR:$('hindPawR'),tail1:$('tail1'),tail2:$('tail2'),tail3:$('tail3'),browL:$('browL'),browR:$('browR')};let mx=.5,my=.5,pet=false,nap=false,laserOn=false,sound=true,ctx,voiceTimer,earHitL=0,earHitR=0,tailHit=0,waveUntil=0;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function tr(el,v){el.setAttribute('transform',v)}function say(t,d=1200){clearTimeout(voiceTimer);speech.textContent=t;speech.classList.add('on');voiceTimer=setTimeout(()=>speech.classList.remove('on'),d)}function heart(x,y,c='💗'){let h=document.createElement('div');h.className='heart';h.textContent=c;h.style.left=x+'px';h.style.top=y+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),1050)}function audio(){if(!sound)return null;ctx||=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function meow(p=1){let a=audio();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(380*p,a.currentTime);o.frequency.exponentialRampToValueAtTime(620*p,a.currentTime+.08);o.frequency.exponentialRampToValueAtTime(470*p,a.currentTime+.24);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.045,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.28);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.29)}function partClick(name,e){if(name==='left-ear'){earHitL=performance.now()+650;say('ear twitch!');meow(1.1)}else if(name==='right-ear'){earHitR=performance.now()+650;say('other ear!');meow(1.05)}else if(name==='tail'){tailHit=performance.now()+900;say('hey, my tail! 😾');meow(.8)}else if(name==='left-paw'){waveUntil=performance.now()+1500;say('tiny high five! 🐾');meow(1.15)}else if(name==='right-paw'){waveUntil=performance.now()+1500;say('paw hello!');meow(1.12)}else if(name==='nose'){say('boop!');meow(1.28)}else if(name==='belly'||name==='chest'){say('prrrrr…');heart(e.clientX,e.clientY);pet=true;setTimeout(()=>pet=false,750)}else if(name==='left-eye'||name==='right-eye'){say('👀 I see you');meow(1.2)}else if(name==='mouth'){say('mew!');meow();}else if(name==='left-whiskers'||name==='right-whiskers'){say('whiskers tickle!');meow(1.18)}else if(name==='head'){pet=true;say('prrrrr…');heart(e.clientX,e.clientY);setTimeout(()=>pet=false,850)}}cat.querySelectorAll('[data-part]').forEach(el=>el.addEventListener('pointerdown',e=>{e.stopPropagation();partClick(el.dataset.part,e)}));addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight;if(laserOn){laser.style.left=e.clientX+'px';laser.style.top=e.clientY+'px'}});$('rigBtn').onclick=()=>{cat.classList.toggle('rig');$('rigBtn').textContent=cat.classList.contains('rig')?'🦴 Hide rig':'🦴 Show rig'};$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 Sound':'🔇 Muted';if(sound)meow(1.12)};document.querySelector('[data-a=pet]').onclick=()=>{pet=true;say('full head rub 💗');meow(1.08);let r=cat.getBoundingClientRect();heart(r.left+r.width*.5,r.top+r.height*.31);setTimeout(()=>pet=false,1100)};document.querySelector('[data-a=wave]').onclick=()=>{waveUntil=performance.now()+1800;say('hello!! 🐾');meow(1.18)};document.querySelector('[data-a=laser]').onclick=e=>{laserOn=!laserOn;laser.classList.toggle('on',laserOn);e.currentTarget.textContent=laserOn?'⏹ Stop laser':'🔴 Laser';say(laserOn?'TARGET 👀':'caught it!')};document.querySelector('[data-a=nap]').onclick=()=>{nap=!nap;say(nap?'tiny nap… 🌙':'big stretch!');meow(nap?.72:1.15)};
function animate(now){let t=now/1000,lookX=(mx-.5)*2,lookY=(my-.5)*2;let sleepy=nap?1:0;
// whole body and chest breathe independently
tr(P.body,`translate(0 ${Math.sin(t*1.7)*2}) scale(1 ${1+Math.sin(t*1.7)*.018})`);tr(P.chest,`translate(0 ${Math.sin(t*1.7+.25)*3}) scale(${1+Math.sin(t*1.7+.25)*.01} ${1+Math.sin(t*1.7+.25)*.025})`);
// head follows pointer, but has its own idle angle
let headRot=lookX*5+Math.sin(t*.8)*1.4+(pet?-3:0),headY=lookY*5+Math.sin(t*1.2)*1.5+(nap?8:0);tr(P.head,`translate(${lookX*4} ${headY}) rotate(${headRot})`);
// ears are independent, with direct-touch kick
let kickL=now<earHitL?-18*Math.sin((earHitL-now)/650*Math.PI):0,kickR=now<earHitR?18*Math.sin((earHitR-now)/650*Math.PI):0;tr(P.earL,`translate(-73 -75) rotate(${Math.sin(t*2.1)*2.5+kickL+(pet?-9:0)})`);tr(P.earR,`translate(73 -75) rotate(${Math.sin(t*1.73+1.5)*2.8+kickR+(pet?9:0)})`);
// eyes blink independently, pupils track pointer independently
let blinkA=(Math.sin(t*.92)+1)/2>.992?.08:1,blinkB=(Math.sin(t*.92+.09)+1)/2>.992?.09:1;if(nap){blinkA=.08;blinkB=.08}tr(P.eyeL,`translate(-48 -17) scale(1 ${blinkA})`);tr(P.eyeR,`translate(48 -17) scale(1 ${blinkB})`);tr(P.pupilL,`translate(${lookX*7} ${lookY*5})`);tr(P.pupilR,`translate(${lookX*7.5} ${lookY*5})`);
// cheeks, nose, whiskers, mouth each have their own motion
tr(P.cheekL,`translate(${-38+Math.sin(t*2.7)*.8} ${29+Math.sin(t*2.2)*.7})`);tr(P.cheekR,`translate(${38-Math.sin(t*2.5)*.8} ${29+Math.sin(t*2.25+.4)*.7})`);tr(P.nose,`translate(0 23) scale(${1+Math.sin(t*4.2)*.035})`);tr(P.whiskL,`rotate(${Math.sin(t*2.5)*1.8+(pet?-3:0)})`);tr(P.whiskR,`rotate(${Math.sin(t*2.35+.7)*1.8+(pet?3:0)})`);let mouthOpen=laserOn?1:pet?.7:0;tr(P.mouth,`translate(0 43) scale(1 ${1+mouthOpen*.18})`);P.tongue.style.opacity=mouthOpen?.9:0;
// front limbs use separate shoulder, elbow and paw phases
