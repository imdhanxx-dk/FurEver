<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7ef"><title>Fluffy • Interactive Cat</title><style>:root{--x:0deg;--y:0deg;--tx:0px;--ty:0px;--ink:#3b2a27;--muted:#806963;--glass:rgba(255,255,255,.72);--line:rgba(93,62,49,.12)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}body{overflow:hidden;touch-action:none;user-select:none;color:var(--ink);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;background:radial-gradient(circle at 18% 18%,#ffd9bc 0,transparent 30%),radial-gradient(circle at 82% 18%,#ffd7df 0,transparent 28%),linear-gradient(145deg,#fffaf6,#fff0e6 56%,#fff7ef)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(116,78,57,.08) .7px,transparent .7px);background-size:18px 18px;mask-image:linear-gradient(#0009,transparent 78%)}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}.top{display:flex;justify-content:space-between;align-items:center;z-index:10}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.logo,.sound,.btn,.stat{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 10px 28px #60402d12}.logo{width:40px;height:40px;border-radius:15px;display:grid;place-items:center}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}.name{border:0;background:none;color:inherit;font:inherit;font-weight:900;width:118px;outline:none}.sound{border-radius:16px;padding:10px 13px;font-weight:800;color:inherit}.stage{position:relative;display:grid;place-items:center;min-height:0}.scene{position:relative;width:min(88vw,630px);aspect-ratio:1}.halo{position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffffff7a 52%,transparent 73%);filter:blur(4px);animation:halo 5s ease-in-out infinite}.shadow{position:absolute;left:22%;right:22%;bottom:8%;height:8%;border-radius:50%;background:#5e3d2d20;filter:blur(16px);transform:rotateX(65deg)}.cat{position:absolute;inset:3%;transform:translate3d(var(--tx),var(--ty),0) rotateX(var(--y)) rotateY(var(--x));transform-origin:50% 72%;transition:transform .14s cubic-bezier(.2,.8,.2,1);animation:breathe 3.6s ease-in-out infinite;cursor:grab;filter:drop-shadow(0 24px 24px #6a43251a)}.cat:active{cursor:grabbing}.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.tail{clip-path:polygon(62% 35%,100% 35%,100% 96%,63% 96%);transform-origin:70% 77%;animation:tail 3.4s ease-in-out infinite}.el{clip-path:polygon(26% 3%,44% 3%,45% 29%,27% 28%);transform-origin:35% 20%;animation:earL 7s ease-in-out infinite}.er{clip-path:polygon(51% 9%,81% 14%,73% 36%,53% 31%);transform-origin:64% 22%;animation:earR 6.2s ease-in-out infinite}@keyframes breathe{50%{scale:1.012 .994}}@keyframes halo{50%{transform:scale(1.04);opacity:.8}}@keyframes tail{50%{transform:rotate(2.4deg)}}@keyframes earL{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-5deg)}90%{transform:rotate(3deg)}}@keyframes earR{0%,76%,100%{transform:rotate(0)}81%{transform:rotate(5deg)}86%{transform:rotate(-3deg)}}.cat.happy{animation:breathe 2.8s ease-in-out infinite,bounce .48s ease}@keyframes bounce{35%{translate:0 -11px}60%{translate:0 2px}}.cat.sleep{animation:breathe 5.2s ease-in-out infinite;filter:saturate(.82) drop-shadow(0 24px 24px #6a43251a);transform:translate3d(var(--tx),calc(var(--ty) + 12px),0) rotateZ(-1.5deg)}.bubble{position:absolute;top:14%;left:66%;padding:10px 14px;max-width:180px;border-radius:18px 18px 18px 5px;background:#fffffff2;border:1px solid var(--line);box-shadow:0 12px 30px #5c3c2b1c;font-size:13px;font-weight:850;opacity:0;transform:translateY(8px) scale(.96);transition:.2s;pointer-events:none}.bubble.on{opacity:1;transform:none}.zzz{position:absolute;top:23%;left:70%;font-weight:900;color:#8e7893;letter-spacing:.18em;opacity:0}.zzz.on{animation:zzz 2.6s ease-in-out infinite}@keyframes zzz{0%{opacity:0;transform:translate(0,8px)}35%{opacity:1}100%{opacity:0;transform:translate(24px,-40px) scale(1.2)}}.stats{position:absolute;left:0;top:50%;transform:translateY(-50%);display:grid;gap:9px}.stat{width:165px;padding:11px 13px;border-radius:18px}.row{display:flex;justify-content:space-between;font-size:12px;font-weight:850}.row span:last-child{color:var(--muted)}.bar{height:7px;background:#53372612;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:var(--v);background:linear-gradient(90deg,#ffad74,#ff7d8e);border-radius:99px;transition:width .4s}.mood{position:absolute;right:0;top:50%;transform:translateY(-50%);width:170px;padding:14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 12px 30px #60402d12}.mood b{display:block;margin:4px 0}.mood p{margin:0;color:var(--muted);font-size:11px;line-height:1.4}.hint{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;z-index:10}.btn{border-radius:18px;padding:12px 16px;color:inherit;font-size:13px;font-weight:900;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.98)}.laser{position:fixed;width:14px;height:14px;border-radius:50%;background:#ff4f78;box-shadow:0 0 0 5px #ff4f7822,0 0 24px #ff4f78bb;translate:-50% -50%;opacity:0;pointer-events:none;z-index:60}.laser.on{opacity:1}.heart{position:fixed;pointer-events:none;z-index:70;font-size:18px;animation:heart 1s ease-out forwards}@keyframes heart{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-110px) scale(1.25)}}.treat{position:fixed;z-index:80;font-size:28px;pointer-events:none;translate:-50% -50%;transition:transform .65s cubic-bezier(.2,.8,.3,1),opacity .65s}@media(max-width:900px){.stats,.mood{top:auto;bottom:0;transform:none}.stats{grid-template-columns:repeat(2,1fr)}.stat{width:140px}.mood{right:0}.scene{width:min(96vw,590px)}}@media(max-width:620px){.scene{width:112vw;max-width:none;transform:translateX(-6vw);margin-top:2vh}.stats{left:50%;transform:translateX(-50%);width:min(92vw,360px)}.stat{width:auto}.mood{display:none}.hint{bottom:15%;font-size:10px}.bubble{left:59%;font-size:12px}.sound{font-size:11px;padding:9px 10px}.btn{padding:11px 13px}.brand small{font-size:9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}</style></head><body><div class="app"><div class="top"><div class="brand"><div class="logo">🐾</div><div><input id="name" class="name" value="Fluffy" aria-label="Cat name"><small>interactive companion</small></div></div><button id="sound" class="sound">🔊 Sound on</button></div><main class="stage"><div class="stats"><div class="stat"><div class="row"><span>💗 Bond</span><span id="bv">72</span></div><div class="bar"><i id="bb" style="--v:72%"></i></div></div><div class="stat"><div class="row"><span>🍗 Fullness</span><span id="fv">68</span></div><div class="bar"><i id="fb" style="--v:68%"></i></div></div></div><div class="scene"><div class="halo"></div><div class="shadow"></div><div id="cat" class="cat"><img src="https://raw.githubusercontent.com/imdhanxx-dk/FurEver/temp-interactive-cat/interactive-cat-demo/cat.webp" alt="Cute fluffy ginger and white cat"><img class="tail" src="https://raw.githubusercontent.com/imdhanxx-dk/FurEver/temp-interactive-cat/interactive-cat-demo/cat.webp" alt=""><img class="el" src="https://raw.githubusercontent.com/imdhanxx-dk/FurEver/temp-interactive-cat/interactive-cat-demo/cat.webp" alt=""><img class="er" src="https://raw.githubusercontent.com/imdhanxx-dk/FurEver/temp-interactive-cat/interactive-cat-demo/cat.webp" alt=""></div><div id="bubble" class="bubble">mrrp?</div><div id="zzz" class="zzz">Z z z</div></div><aside class="mood"><div id="emoji" style="font-size:26px">🥰</div><b id="moodT">Cozy</b><p id="moodP">Watching you very carefully.</p></aside><div class="hint">Move around • drag/pet the cat • tap for reactions</div></main><div class="controls"><button class="btn" data-a="pet">🫳 Pet</button><button class="btn" data-a="feed">🍗 Feed</button><button class="btn" data-a="play">🔴 Play</button><button class="btn" data-a="nap">🌙 Nap</button></div></div><div id="laser" class="laser"></div><script>(()=>{const r=document.documentElement,c=document.getElementById('cat'),b=document.getElementById('bubble'),z=document.getElementById('zzz'),l=document.getElementById('laser'),sv=document.getElementById('sound'),bb=document.getElementById('bb'),fb=document.getElementById('fb'),bv=document.getElementById('bv'),fv=document.getElementById('fv'),mt=document.getElementById('moodT'),mp=document.getElementById('moodP'),me=document.getElementById('emoji');let bond=72,food=68,pet=false,play=false,sleep=false,sound=true,timer,last=0,ctx,po,pg,pl;const rx=['mrrp! ✨','prrrrr…','tiny headbutt 💗','more pets?','mew!','🐾 slow blink','you have been chosen.'];const clamp=(n,a,d)=>Math.max(a,Math.min(d,n));function say(t,m=1400){clearTimeout(timer);b.textContent=t;b.classList.add('on');timer=setTimeout(()=>b.classList.remove('on'),m)}function stats(){bond=clamp(Math.round(bond),0,100);food=clamp(Math.round(food),0,100);bv.textContent=bond;fv.textContent=food;bb.style.setProperty('--v',bond+'%');fb.style.setProperty('--v',food+'%')}function mood(e,t,p){me.textContent=e;mt.textContent=t;mp.textContent=p}function burst(){c.classList.remove('happy');void c.offsetWidth;c.classList.add('happy');setTimeout(()=>c.classList.remove('happy'),520)}function heart(x,y,i='💗'){const h=document.createElement('div');h.className='heart';h.textContent=i;h.style.left=x+'px';h.style.top=y+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),1050)}function audio(){if(!sound)return null;ctx||=new(AudioContext||webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function chirp(){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(430,a.currentTime);o.frequency.exponentialRampToValueAtTime(690,a.currentTime+.08);o.frequency.exponentialRampToValueAtTime(510,a.currentTime+.2);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.05,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.22);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.24)}function purr(){const a=audio();if(!a||po)return;po=a.createOscillator();pg=a.createGain();pl=a.createOscillator();const q=a.createGain();po.type='triangle';po.frequency.value=48;pl.frequency.value=23;q.gain.value=.015;pg.gain.value=.02;pl.connect(q).connect(pg.gain);po.connect(pg).connect(a.destination);po.start();pl.start()}function stop(){if(po){try{po.stop();pl.stop()}catch{}po=pg=pl=null}}addEventListener('pointermove',e=>{const nx=(e.clientX/innerWidth-.5)*2,ny=(e.clientY/innerHeight-.5)*2;r.style.setProperty('--x',nx*4.2+'deg');r.style.setProperty('--y',-ny*2.5+'deg');if(play){l.style.left=e.clientX+'px';l.style.top=e.clientY+'px';r.style.setProperty('--tx',clamp((e.clientX-innerWidth/2)*.035,-18,18)+'px');r.style.setProperty('--ty',clamp((e.clientY-innerHeight/2)*.02,-10,10)+'px')}if(pet&&performance.now()-last>90){last=performance.now();heart(e.clientX,e.clientY,Math.random()>.5?'💗':'✨');bond+=.35;stats();purr()}});c.addEventListener('pointerdown',e=>{if(sleep){sleep=false;c.classList.remove('sleep');z.classList.remove('on');mood('😺','Awake','A tiny stretch. Ready again.');say('mrrrow… stretch!');chirp();return}pet=true;c.setPointerCapture?.(e.pointerId);purr();say('prrrrr…');heart(e.clientX,e.clientY);bond++;stats()});c.addEventListener('pointerup',()=>{pet=false;stop();chirp();say(rx[Math.floor(Math.random()*rx.length)]);burst()});c.addEventListener('pointercancel',()=>{pet=false;stop()});document.querySelectorAll('.btn').forEach(btn=>btn.onclick=()=>{const a=btn.dataset.a;if(a==='pet'){const q=c.getBoundingClientRect();heart(q.left+q.width*.5,q.top+q.height*.45);bond+=2;stats();burst();say('chin scratches, please!');chirp();mood('🥰','Melted','Maximum chin-scratch approval.')}if(a==='feed'){sleep=false;c.classList.remove('sleep');z.classList.remove('on');const q=btn.getBoundingClientRect(),k=c.getBoundingClientRect(),t=document.createElement('div');t.className='treat';t.textContent='🍗';t.style.left=q.left+q.width/2+'px';t.style.top=q.top+q.height/2+'px';document.body.appendChild(t);requestAnimationFrame(()=>{t.style.transform=`translate(${k.left+k.width*.5-(q.left+q.width/2)}px,${k.top+k.height*.40-(q.top+q.height/2)}px) scale(.55)`;t.style.opacity='.1'});setTimeout(()=>{t.remove();food+=16;bond++;stats();burst();chirp();say('nom nom! ✨');mood('😸','Satisfied','Snack successfully inspected.')},650)}if(a==='play'){sleep=false;c.classList.remove('sleep');z.classList.remove('on');play=!play;l.classList.toggle('on',play);btn.textContent=play?'⏹ Stop':'🔴 Play';if(!play){r.style.setProperty('--tx','0px');r.style.setProperty('--ty','0px')}say(play?'TARGET ACQUIRED 👀':'good hunt!');mood(play?'🤩':'🥰',play?'Hunter mode':'Cozy',play?'Move your finger or cursor.':'Back to loafing responsibly.');if(play){bond++;stats();chirp()}}if(a==='nap'){play=false;l.classList.remove('on');document.querySelector('[data-a=play]').textContent='🔴 Play';sleep=!sleep;c.classList.toggle('sleep',sleep);z.classList.toggle('on',sleep);say(sleep?'tiny nap… 🌙':'morning?');mood(sleep?'😴':'😺',sleep?'Sleepy loaf':'Awake',sleep?'Dreaming about a suspiciously large fish.':'Back on tiny-cat duty.')}});sv.onclick=()=>{sound=!sound;sv.textContent=sound?'🔊 Sound on':'🔇 Sound off';if(!sound)stop();else chirp()};document.getElementById('name').oninput=e=>e.target.value=e.target.value.slice(0,14);setInterval(()=>{if(!pet&&!play&&!sleep&&Math.random()<.35)say(rx[Math.floor(Math.random()*rx.length)],1100)},5200);setInterval(()=>{if(!sleep){food-=.4;stats()}},9000);addEventListener('blur',()=>{pet=false;stop()})})();</script></body></html>
